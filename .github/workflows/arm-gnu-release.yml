name: Release

# On a tag, cross-compiles qcperf-tui for Linux ARM64 (ARM GNU) and Windows
# ARM64 (MSVC), then publishes both archives on one GitHub Release.
#
# Push any tag (for example v0.1.0.0), or run the workflow and pass an
# existing tag.

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release
        required: true
        type: string

permissions:
  contents: write

env:
  AARCH64_TOOLCHAIN_VERSION: "15.2.rel1"
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux-arm-gnu:
    name: Build linux-aarch64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          persist-credentials: false

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            autoconf \
            automake \
            libtool \
            clang \
            libclang-dev \
            curl \
            xz-utils \
            file

      - name: Download ARM GNU toolchain
        run: |
          set -euo pipefail
          url="https://developer.arm.com/-/media/Files/downloads/gnu/${AARCH64_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${AARCH64_TOOLCHAIN_VERSION}-x86_64-aarch64-none-linux-gnu.tar.xz"
          mkdir -p "${RUNNER_TEMP}/arm-gnu-toolchain"
          curl -fL "${url}" -o /tmp/toolchain.tar.xz
          tar -xJf /tmp/toolchain.tar.xz -C "${RUNNER_TEMP}/arm-gnu-toolchain" --strip-components=1
          echo "AARCH64_TOOLCHAIN_PATH=${RUNNER_TEMP}/arm-gnu-toolchain" >> "${GITHUB_ENV}"
          echo "${RUNNER_TEMP}/arm-gnu-toolchain/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/arm-gnu-toolchain/bin/aarch64-none-linux-gnu-gcc" --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Resolve library version
        id: version
        run: |
          set -euo pipefail
          raw="${RELEASE_TAG#v}"
          IFS='.' read -r -a parts <<< "${raw}"
          while [ "${#parts[@]}" -lt 4 ]; do
            parts+=("0")
          done
          echo "project_version=${parts[0]}.${parts[1]}.${parts[2]}.${parts[3]}" >> "${GITHUB_OUTPUT}"

      - name: Build fastrpc
        working-directory: third_party/libqcperf
        run: |
          set -euo pipefail
          chmod +x qcperf/ci/build-fastrpc.sh
          qcperf/ci/build-fastrpc.sh \
            "${AARCH64_TOOLCHAIN_PATH}/bin/aarch64-none-linux-gnu-gcc" \
            "${AARCH64_TOOLCHAIN_PATH}/bin/aarch64-none-linux-gnu-ar" \
            "${AARCH64_TOOLCHAIN_PATH}/bin/aarch64-none-linux-gnu-ranlib"
          test -f qcperf/third-party/fastrpc/src/.libs/libcdsprpc.so

      - name: Build libqcperf
        working-directory: third_party/libqcperf
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.project_version }}
        run: |
          set -euo pipefail
          cmake -S qcperf -B build-linux-aarch64-release \
            -DTARGET_ARCH=linux-aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DProjectVersion="${PROJECT_VERSION}" \
            -DBUILD_SHARED=OFF
          cmake --build build-linux-aarch64-release
          test -f build-linux-aarch64-release/libqcperfCore.a

      - name: Build qcperf-tui
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-unknown-linux-gnu
          file target/aarch64-unknown-linux-gnu/release/qcperf-tui
          file target/aarch64-unknown-linux-gnu/release/qcperf-tui | grep -q "ARM aarch64"

      - name: Package release archive
        id: package
        run: |
          set -euo pipefail
          name="qcperf-tui-${RELEASE_TAG}-linux-aarch64"
          stage="staging/${name}"
          mkdir -p "${stage}"
          cp target/aarch64-unknown-linux-gnu/release/qcperf-tui "${stage}/qcperf-tui"
          cp third_party/libqcperf/build-linux-aarch64-release/libqcperfCore.a "${stage}/libqcperfCore.a"
          cp third_party/libqcperf/qcperf/third-party/fastrpc/src/.libs/libcdsprpc.so "${stage}/libcdsprpc.so"
          chmod 755 "${stage}/qcperf-tui"
          tar -C staging -czf "${name}.tar.gz" "${name}"
          echo "archive=${name}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-aarch64
          path: ${{ steps.package.outputs.archive }}
          retention-days: 7

  windows-arm64:
    name: Build windows-arm64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          persist-credentials: false

      - name: Install MSVC ARM64 build tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -property installationPath
          if (-not $installPath) { throw "Visual Studio was not found on this runner" }
          $arm64Host = Get-ChildItem -Path (Join-Path $installPath "VC\Tools\MSVC") -Recurse -Directory -Filter arm64 -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\arm64$' }
          if ($arm64Host) {
            Write-Host "MSVC ARM64 tools already installed"
            exit 0
          }
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          & $setup modify --installPath $installPath --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --includeRecommended --quiet --norestart --wait
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }

      - name: Install LLVM
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM -e --accept-source-agreements --accept-package-agreements --disable-interactivity
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            throw "libclang.dll was not installed at $llvmBin"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvmBin"
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Build qcperf-tui
        shell: pwsh
        run: |
          cargo build --release --target aarch64-pc-windows-msvc
          if (-not (Test-Path "target\aarch64-pc-windows-msvc\release\qcperf-tui.exe")) {
            throw "qcperf-tui.exe was not produced"
          }

      - name: Package release archive
        id: package
        shell: pwsh
        run: |
          $name = "qcperf-tui-$env:RELEASE_TAG-windows-arm64"
          $stage = Join-Path "staging" $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\aarch64-pc-windows-msvc\release\qcperf-tui.exe" $stage
          Compress-Archive -Path $stage -DestinationPath "$name.zip" -Force
          Add-Content -Path $env:GITHUB_OUTPUT -Value "archive=$name.zip" -Encoding utf8NoBOM

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-arm64
          path: ${{ steps.package.outputs.archive }}
          retention-days: 7

      - name: Show Rust target
        run: rustc -vV

      - name: Show Clang version
        run: clang --version

      - name: Show INCLUDE
        shell: pwsh
        run: echo $env:INCLUDE

  publish:
    name: Publish GitHub Release
    needs: [linux-arm-gnu, windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(artifacts/*.tar.gz artifacts/*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No release archives were downloaded" >&2
            exit 1
          fi
          notes=$(cat <<EOF
          qcperf-tui ${RELEASE_TAG}

          - \`qcperf-tui-${RELEASE_TAG}-linux-aarch64.tar.gz\` — Linux ARM64 binary, built with the ARM GNU toolchain ${AARCH64_TOOLCHAIN_VERSION}. Includes \`libqcperfCore.a\` and the fastrpc \`libcdsprpc.so\` used to link the NPU backend. On device, set \`LD_LIBRARY_PATH\` if the system fastrpc library is not found.
          - \`qcperf-tui-${RELEASE_TAG}-windows-arm64.zip\` — Windows ARM64 \`qcperf-tui.exe\`, cross-compiled with MSVC.
          EOF
          )
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${archives[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${archives[@]}" \
              --title "${RELEASE_TAG}" \
              --notes "${notes}"
          fi
