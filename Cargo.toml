[package]
name = "qcperf-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for live libqcperf metric graphs"
license = "BSD-3-Clause"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }

[build-dependencies]
bindgen = "0.71"
